  b2b_or_b2c: b2b
  exclude: []
icp:
  must_have: ["takes phone bookings"]
  nice_to_have: ["4.3+ rating, 100+ reviews"]
  disqualifiers: []  # TODO
  signals: []        # TODO: confirm from the signal library
channels:
  allowed: [email, linkedin_manual, whatsapp_manual, visit, call_inbound]
  forbidden: [cold_call, cold_sms, cold_whatsapp]
  copy_language: en
  tone: "confident founder, warm, a little playful, never hype"
sender:
  from_name: Aniket
  role: Founder
  business_phone: null  # TODO: the one business number (inbound only, never used for cold calls)
  postal_address: "TODO: postal address for the email footer (required before any send)"
  mailboxes: [admin@voicesync.in]
constraints:
  monthly_budget_usd: 50
  daily_new_prospects: 5
  approval: required
  test_mode_only_to: []  # TODO: the operator's own test inbox

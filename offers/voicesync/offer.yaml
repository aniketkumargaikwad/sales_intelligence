# VoiceSync: the first real offer. Drafted 2026-10-22 from docs/brief.md (§1, §2, §8).
# Items marked TODO are waiting on the operator; see context/open-questions.md.
offer:
  name: VoiceSync
  one_liner: "An AI receptionist that answers every call 24/7 in Marathi, Hindi and English"
  type: saas
  website: https://voicesync.in
  price: { from: "₹2,499/month", upfront: "none", trial: "14-day pilot" }  # the ONLY prices copy may state
  proof: { customers: [], case_studies: [], numbers: [] }                   # empty = never claim any
  differentiators:
    - "Answers every call, 24/7, including after hours and during treatments"
    - "Speaks Marathi, Hindi and English"
    - "Each prospect gets a working demo receptionist that already knows their clinic before we reach out"
  objections: []  # TODO: the operator's most common objections and answers
  proof_asset: { adapter: voicesync_demo, description: "per-prospect demo receptionist that already knows the clinic's timings, plus a /for/<slug> know-more page" }
market:
  geographies:
    - { country: IN, regions: [Maharashtra], timezone: Asia/Kolkata }

# Apply pending database migrations to the project database. Manual on purpose.
name: migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SI_DATABASE_URL: ${{ secrets.SI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - run: uv run python -m si migrate
      - run: uv run python -m si check --only database
